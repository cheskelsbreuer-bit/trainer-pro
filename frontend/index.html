<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trainer Pro" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Trainer Pro — Run your personal training business in one place</title>
    <meta name="description" content="The clean web dashboard for personal trainers. Clients, workouts, payments, and progress — no app, no per-client fees. Free during beta." />
    <meta name="theme-color" content="#2563eb" />

    <!-- Dojo app (martial-arts template) uses Bebas Neue for heroic display
         type. Preconnect + a tiny single-weight pull keeps it cheap for
         everyone else who doesn't render the dojo UI. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Outfit:wght@400;500;600;700&display=swap"
    />

    <!-- Open Graph / social share -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trainer Pro — Run your personal training business in one place" />
    <meta property="og:description" content="The clean web dashboard for personal trainers. Clients, workouts, payments, and progress — no app, no per-client fees." />
    <meta property="og:url" content="https://trainerpro.coach" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
